<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  :root{
    --void:#080d16;
    --deck:#0d1522;
    --panel:#131e30;
    --panel-2:#18263c;
    --line:#26364f;
    --line-soft:#1c2a41;
    --ink:#eef3fb;
    --muted:#8496b3;
    --muted-2:#5f708c;
    --signal:#ffb02e;      /* telemetry amber */
    --signal-dim:#7a5a1c;
    --go:#37d9a0;          /* PURSUE */
    --watch:#ffb02e;       /* WATCH */
    --pass:#ff5d6c;        /* PASS */
    --cyan:#5ab0ff;        /* AI / chat */
    --grid: rgba(90,176,255,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:14px;line-height:1.5;
  }
  #root{height:100vh}
  .mono{font-family:"JetBrains Mono",monospace}
  .disp{font-family:"Space Grotesk",sans-serif}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#22334d;border-radius:6px;border:2px solid var(--deck)}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  .eyebrow{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-2)}

  /* shell */
  .shell{display:grid;grid-template-columns:290px 1fr;height:100vh;overflow:hidden}
  .rail{background:linear-gradient(180deg,var(--deck),#0a111c);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;min-height:0}
  .main{position:relative;min-width:0;overflow:hidden;display:flex;flex-direction:column;
    background:
      radial-gradient(1200px 600px at 78% -8%, rgba(90,176,255,.06), transparent 60%),
      linear-gradient(180deg,#0b111d,#080d16);
  }
  .main::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 70%)}

  /* brand */
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;align-items:center}
  .logo{width:38px;height:38px;flex:0 0 auto;border-radius:9px;background:radial-gradient(circle at 50% 35%,#1b2c46,#0c1421);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
  .logo svg{width:24px;height:24px}
  .brand h1{font-family:"Space Grotesk";font-size:15px;font-weight:600;margin:0;letter-spacing:.02em}
  .brand .sub{font-family:"JetBrains Mono";font-size:9.5px;letter-spacing:.24em;color:var(--muted-2);text-transform:uppercase;margin-top:2px}

  .secure{margin:12px 14px 4px;display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line-soft);border-radius:8px;background:rgba(55,217,160,.05)}
  .secure .dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go);flex:0 0 auto}
  .secure span{font-family:"JetBrains Mono";font-size:10px;letter-spacing:.06em;color:#9fe6cb;line-height:1.35}

  .newbtn{margin:12px 14px;padding:11px 14px;border-radius:9px;border:1px solid var(--signal-dim);
    background:linear-gradient(180deg,rgba(255,176,46,.16),rgba(255,176,46,.06));color:var(--signal);
    font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .newbtn:hover{background:rgba(255,176,46,.2);box-shadow:0 0 0 1px var(--signal-dim)}

  .rosterhead{padding:6px 18px;display:flex;justify-content:space-between;align-items:center}
  .roster{overflow-y:auto;flex:1;padding:2px 10px 14px;min-height:0}
  .ritem{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:9px;padding:11px 12px;margin-bottom:5px;display:flex;gap:11px;align-items:flex-start;transition:.13s;color:inherit}
  .ritem:hover{background:var(--panel);border-color:var(--line-soft)}
  .ritem.active{background:var(--panel);border-color:var(--line)}
  .rlight{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:#33435d}
  .rlight.PURSUE{background:var(--go);box-shadow:0 0 7px var(--go)}
  .rlight.WATCH{background:var(--watch);box-shadow:0 0 7px var(--watch)}
  .rlight.PASS{background:var(--pass);box-shadow:0 0 7px var(--pass)}
  .rlight.pulse{animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .rname{font-weight:600;font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rmeta{font-family:"JetBrains Mono";font-size:10px;color:var(--muted-2);margin-top:3px;letter-spacing:.04em}
  .rscore{margin-left:auto;font-family:"JetBrains Mono";font-size:15px;font-weight:700;flex:0 0 auto}
  .rempty{color:var(--muted-2);font-size:12px;padding:16px 12px;line-height:1.6}

  /* main scroll */
  .stage{position:relative;z-index:1;overflow-y:auto;flex:1;min-height:0}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 30px 60px}

  /* empty */
  .empty{height:100%;display:grid;place-items:center;position:relative;z-index:1;text-align:center;padding:30px}
  .empty .ring{width:120px;height:120px;margin:0 auto 26px}
  .empty h2{font-family:"Space Grotesk";font-weight:600;font-size:26px;margin:0 0 10px;letter-spacing:-.01em}
  .empty p{color:var(--muted);max-width:440px;margin:0 auto 22px;line-height:1.65}

  /* header card */
  .head{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:center;
    background:linear-gradient(180deg,var(--panel),rgba(19,30,48,.4));border:1px solid var(--line-soft);
    border-radius:16px;padding:24px 26px;position:relative;overflow:hidden}
  .head::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--signal),transparent)}
  .h-name{font-family:"Space Grotesk";font-size:27px;font-weight:600;letter-spacing:-.01em;margin:6px 0 4px;line-height:1.1}
  .h-one{color:var(--muted);max-width:640px;line-height:1.55}
  .tel{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .tcell{background:var(--deck);border:1px solid var(--line-soft);border-radius:10px;padding:9px 13px;min-width:104px}
  .tcell .k{font-family:"JetBrains Mono";font-size:9px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase}
  .tcell .v{font-family:"JetBrains Mono";font-size:18px;font-weight:700;margin-top:3px}
  .tcell .v small{font-size:11px;color:var(--muted);font-weight:500}

  /* gauge */
  .gaugebox{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:220px}
  .verdictlights{display:flex;gap:7px}
  .vl{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-soft);font-family:"JetBrains Mono";font-size:10px;letter-spacing:.1em;color:var(--muted-2);opacity:.5;transition:.2s}
  .vl .b{width:7px;height:7px;border-radius:50%;background:currentColor}
  .vl.PURSUE{color:var(--go)} .vl.WATCH{color:var(--watch)} .vl.PASS{color:var(--pass)}
  .vl.on{opacity:1;border-color:currentColor;background:rgba(255,255,255,.03);box-shadow:0 0 14px -4px currentColor}

  /* tabs */
  .tabs{display:flex;gap:2px;margin:22px 0 18px;border-bottom:1px solid var(--line-soft)}
  .tab{background:transparent;border:none;color:var(--muted);padding:12px 18px;font-size:13px;font-weight:600;position:relative;letter-spacing:.01em}
  .tab .cnt{font-family:"JetBrains Mono";font-size:10px;color:var(--muted-2);margin-left:6px}
  .tab.active{color:var(--ink)}
  .tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--signal)}
  .tab:hover{color:var(--ink)}

  /* panels/cards */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:18px 20px}
  .card h3{font-family:"Space Grotesk";font-size:13px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:9px;letter-spacing:.02em}
  .card h3 .tag{font-family:"JetBrains Mono";font-size:9px;letter-spacing:.14em;padding:3px 7px;border-radius:5px;color:var(--void);font-weight:700}
  .tag.go{background:var(--go)} .tag.pass{background:var(--pass)} .tag.risk{background:var(--signal)} .tag.ai{background:var(--cyan)}
  .summary{line-height:1.7;color:#d6deec}
  .lead{color:var(--muted);font-size:12.5px;margin:-6px 0 14px;line-height:1.6}

  ul.pc{list-style:none;margin:0;padding:0}
  ul.pc li{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--line-soft);line-height:1.5;color:#d6deec;font-size:13px}
  ul.pc li:last-child{border-bottom:none}
  ul.pc li .m{flex:0 0 auto;margin-top:1px;font-family:"JetBrains Mono";font-weight:700}
  ul.pc.pros .m{color:var(--go)} ul.pc.cons .m{color:var(--pass)} ul.pc.risks .m{color:var(--signal)}

  /* ratings */
  .ratings{display:flex;flex-direction:column;gap:14px}
  .rrow .rl{display:flex;justify-content:space-between;margin-bottom:6px}
  .rrow .rl .name{font-size:12.5px;font-weight:500}
  .rrow .rl .num{font-family:"JetBrains Mono";font-weight:700;font-size:12.5px}
  .bar{height:7px;border-radius:4px;background:var(--deck);overflow:hidden;border:1px solid var(--line-soft)}
  .bar > i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--go));transition:width .6s cubic-bezier(.2,.7,.2,1)}
  input[type=range]{-webkit-appearance:none;width:100%;height:7px;border-radius:4px;background:var(--deck);border:1px solid var(--line-soft);outline:none;margin:0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--signal);border:2px solid var(--void);cursor:pointer;box-shadow:0 0 8px -2px var(--signal)}

  .steps{counter-reset:s;list-style:none;margin:0;padding:0}
  .steps li{position:relative;padding:11px 0 11px 40px;border-bottom:1px solid var(--line-soft);line-height:1.55;color:#d6deec;font-size:13px}
  .steps li:last-child{border-bottom:none}
  .steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);position:absolute;left:0;top:11px;font-family:"JetBrains Mono";font-size:11px;font-weight:700;color:var(--signal);border:1px solid var(--signal-dim);border-radius:6px;padding:2px 6px}

  /* review form */
  .field{margin-bottom:18px}
  .field label{display:block;font-family:"JetBrains Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:7px}
  .field textarea,.field input[type=text]{width:100%;background:var(--deck);border:1px solid var(--line-soft);border-radius:9px;color:var(--ink);padding:11px 13px;font-size:13px;line-height:1.6;resize:vertical}
  .field textarea:focus,.field input:focus{border-color:var(--cyan);outline:none}
  .listedit .row{display:flex;gap:8px;margin-bottom:7px}
  .listedit .row input{flex:1}
  .iconbtn{background:var(--deck);border:1px solid var(--line-soft);border-radius:8px;color:var(--muted);width:38px;flex:0 0 auto;display:grid;place-items:center;font-size:15px}
  .iconbtn:hover{color:var(--pass);border-color:var(--pass)}
  .addbtn{background:transparent;border:1px dashed var(--line);border-radius:8px;color:var(--muted);padding:8px 12px;font-size:12px;width:100%}
  .addbtn:hover{color:var(--ink);border-color:var(--muted)}
  .verdictpick{display:flex;gap:8px}
  .vp{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line-soft);background:var(--deck);color:var(--muted);font-weight:600;font-family:"JetBrains Mono";font-size:12px;letter-spacing:.08em;transition:.15s}
  .vp.PURSUE.sel{color:var(--go);border-color:var(--go);background:rgba(55,217,160,.08)}
  .vp.WATCH.sel{color:var(--watch);border-color:var(--watch);background:rgba(255,176,46,.08)}
  .vp.PASS.sel{color:var(--pass);border-color:var(--pass);background:rgba(255,93,108,.08)}
  .savebar{position:sticky;bottom:0;margin-top:6px;padding:14px 0;display:flex;gap:12px;align-items:center;background:linear-gradient(0deg,var(--void) 60%,transparent)}
  .savebtn{padding:11px 22px;border-radius:9px;border:1px solid var(--go);background:rgba(55,217,160,.14);color:var(--go);font-weight:600;font-size:13px}
  .savebtn:hover{background:rgba(55,217,160,.22)}
  .saved{font-family:"JetBrains Mono";font-size:11px;color:var(--go)}

  /* chat */
  .chatwrap{display:flex;flex-direction:column;height:calc(100vh - 300px);min-height:420px;background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden}
  .chatscroll{flex:1;overflow-y:auto;padding:20px 22px}
  .chatnote{text-align:center;color:var(--muted-2);font-size:12px;padding:20px;line-height:1.7;max-width:460px;margin:0 auto}
  .msg{display:flex;gap:12px;margin-bottom:18px;max-width:88%}
  .msg .av{width:28px;height:28px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-family:"JetBrains Mono";font-size:10px;font-weight:700}
  .msg.user{margin-left:auto;flex-direction:row-reverse}
  .msg.user .av{background:rgba(255,176,46,.14);color:var(--signal);border:1px solid var(--signal-dim)}
  .msg.ai .av{background:rgba(90,176,255,.12);color:var(--cyan);border:1px solid #2c5a8a}
  .bubble{padding:12px 15px;border-radius:12px;line-height:1.65;font-size:13.5px;white-space:pre-wrap}
  .msg.user .bubble{background:rgba(255,176,46,.1);border:1px solid var(--signal-dim)}
  .msg.ai .bubble{background:var(--deck);border:1px solid var(--line-soft);color:#dce4f0}
  .chatbar{border-top:1px solid var(--line-soft);padding:14px;display:flex;gap:10px;background:var(--deck)}
  .chatbar textarea{flex:1;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;color:var(--ink);padding:11px 13px;font-size:13.5px;resize:none;line-height:1.5;max-height:120px}
  .chatbar textarea:focus{border-color:var(--cyan);outline:none}
  .sendbtn{align-self:flex-end;background:var(--cyan);border:none;color:var(--void);border-radius:10px;width:46px;height:46px;display:grid;place-items:center;font-weight:700}
  .sendbtn:disabled{opacity:.4;cursor:default}
  .suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chip{background:var(--deck);border:1px solid var(--line-soft);border-radius:999px;padding:7px 13px;font-size:12px;color:var(--muted)}
  .chip:hover{color:var(--ink);border-color:var(--cyan)}
  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin:0 2px;animation:blink 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  /* modal */
  .backdrop{position:fixed;inset:0;background:rgba(4,8,14,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{width:min(560px,100%);background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--line);border-radius:16px;padding:26px;position:relative}
  .modal h2{font-family:"Space Grotesk";font-size:19px;margin:0 0 4px;font-weight:600}
  .modal p.sub{color:var(--muted);font-size:12.5px;margin:0 0 20px}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;transition:.15s;cursor:pointer;background:rgba(90,176,255,.03)}
  .drop.over{border-color:var(--cyan);background:rgba(90,176,255,.08)}
  .drop .ic{font-size:30px;margin-bottom:10px}
  .drop strong{color:var(--cyan)}
  .drop small{display:block;color:var(--muted-2);margin-top:8px;font-family:"JetBrains Mono";font-size:10px;letter-spacing:.06em}
  .or{text-align:center;color:var(--muted-2);font-family:"JetBrains Mono";font-size:10px;letter-spacing:.2em;margin:16px 0}
  .modal textarea{width:100%;background:var(--deck);border:1px solid var(--line-soft);border-radius:10px;color:var(--ink);padding:12px;font-size:13px;min-height:110px;resize:vertical}
  .modal textarea:focus{border-color:var(--cyan);outline:none}
  .mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:9px;color:var(--muted);padding:10px 18px;font-size:13px;font-weight:600}
  .ghost:hover{color:var(--ink)}
  .primary{background:var(--signal);border:none;border-radius:9px;color:var(--void);padding:10px 20px;font-size:13px;font-weight:700}
  .primary:disabled{opacity:.4;cursor:default}
  .filechip{display:flex;align-items:center;gap:10px;background:var(--deck);border:1px solid var(--line-soft);border-radius:10px;padding:11px 14px;margin-top:6px;font-size:13px}
  .filechip .x{margin-left:auto;color:var(--muted)}
  .filechip .x:hover{color:var(--pass)}

  .analyzing{text-align:center;padding:20px 10px}
  .analyzing .scan{font-family:"JetBrains Mono";font-size:11px;color:var(--cyan);letter-spacing:.08em;margin-top:16px;min-height:16px}
  .prog{height:4px;background:var(--deck);border-radius:3px;overflow:hidden;margin-top:14px}
  .prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--signal));width:0;transition:width .4s}
  .errbox{background:rgba(255,93,108,.08);border:1px solid var(--pass);border-radius:10px;padding:14px;color:#ffb4bb;font-size:12.5px;line-height:1.6;margin-top:14px}

  .kebab{background:transparent;border:none;color:var(--muted-2);font-size:18px;padding:0 6px}
  .kebab:hover{color:var(--pass)}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    .rail{position:fixed;z-index:40;width:290px;height:100vh;transform:translateX(-100%);transition:.2s}
    .rail.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.6)}
    .grid2{grid-template-columns:1fr}
    .head{grid-template-columns:1fr}
    .menutoggle{display:grid!important}
  }
  .menutoggle{display:none;position:absolute;top:16px;left:16px;z-index:5;width:40px;height:40px;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:18px}

  /* auth + setup */
  .authwrap{height:100vh;display:grid;place-items:center;padding:24px;position:relative;
    background:radial-gradient(1000px 700px at 50% -10%, rgba(90,176,255,.08), transparent 60%),linear-gradient(180deg,#0b111d,#080d16)}
  .authwrap::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(600px 400px at 50% 40%,rgba(0,0,0,.6),transparent 75%)}
  .authcard{position:relative;z-index:1;width:min(440px,100%);text-align:center;
    background:linear-gradient(180deg,var(--panel),var(--deck));border:1px solid var(--line);border-radius:18px;padding:38px 34px}
  .authcard .logo{width:56px;height:56px;margin:0 auto 20px}
  .authcard .logo svg{width:34px;height:34px}
  .authcard h1{font-family:"Space Grotesk";font-size:24px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .authcard p{color:var(--muted);line-height:1.6;margin:0 0 26px;font-size:13.5px}
  .gbtn{display:flex;justify-content:center;min-height:44px}
  .authnote{margin-top:22px;font-family:"JetBrains Mono";font-size:10px;letter-spacing:.06em;color:var(--muted-2);line-height:1.7}
  .authnote .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--go);box-shadow:0 0 7px var(--go);margin-right:6px}
  .setup{text-align:left;max-width:560px}
  .setup h1{text-align:center}
  .setup ol{padding-left:18px;margin:0 0 8px;line-height:1.8;font-size:13px;color:#d6deec}

const {useState,useEffect,useRef,useCallback} = React;

/* ---------- editable "company ideals" (Settings) ---------- */
const DEFAULT_SETTINGS = {
  thesis: "A permanent-hold investment firm that buys controlling interests in durable, cash-flow-generating small businesses - typically blue-collar / \"moves atoms\" (trades, manufacturing, service). No fund clock: returns come from ongoing distributions, not a future sale.",
  ebitdaMin: 2, ebitdaMax: 10,      // $M sweet spot

function normSettings(s){
  const d=DEFAULT_SETTINGS;

// Deterministic financial-quality score (0-100) from the extracted numbers.
// Intrinsic to the business (margin, growth, leverage, earnings quality) - independent of price.
function scoreFinancials(fin, s){
  if(!fin) return null;
  const E=Number(fin.ebitda)||0, R=Number(fin.revenue)||0;
  if(E<=0 && R<=0) return null;
  let pts=50;
  // margin
  const margin = R>0 ? E/R : null;
  if(margin!=null){ pts += margin<0.08?-16 : margin<0.15?-6 : margin<0.25?6 : margin<0.40?13 : 18; }
  // revenue growth (YoY)
  const rg = cagr(fin.revPrior, fin.revenue, 1);
  if(rg!=null){ pts += rg<0?-14 : rg<0.05?0 : rg<0.15?8 : rg<0.30?14 : 12; }
  // ebitda growth (YoY)
  const eg = cagr(fin.ebitdaPrior, fin.ebitda, 1);
  if(eg!=null){ pts += eg<0?-8 : eg<0.10?2 : eg<0.30?7 : 9; }
  // size vs sweet spot ($M)
  if(E>0){ const em=E/1e6; const lo=s.ebitdaMin, hi=s.ebitdaMax;
    pts += (em>=lo&&em<=hi)?8 : (em>=lo*0.5&&em<=hi*2)?2 : -6; }
  // leverage
  const nd=Number(fin.netDebt)||0;
  if(E>0){ const lev=nd/E; pts += lev<=0?4 : lev<1?6 : lev<3?0 : lev<4?-6 : -12; }
  // liquidity
  const ca=Number(fin.currentAssets)||0, cl=Number(fin.currentLiab)||0;
  if(cl>0){ const cr=ca/cl; pts += cr>=1.5?4 : cr>=1?0 : -6; }
  // earnings quality: add-back reliance
  const ab=(fin.addbacks||[]).reduce((t,x)=>t+(Number(x.amount)||0),0);
  if(E>0){ const r=ab/E; pts += r>0.15?-8 : r>0.05?-3 : 2; }
  return clamp(pts);
}

/* ---------- Anthropic API ---------- */
async function callClaude(messages, {system, pdf, max_tokens=1500, retries=3}={}){
  const userContent = pdf
    ? [ {type:"document",source:{type:"base64",media_type:"application/pdf",data:pdf}}, {type:"text",text:messages} ]
    : messages;
  const msgs = (typeof userContent === "string" || pdf)
    ? [{role:"user", content: userContent}]
    : userContent; // array of {role,content}
  const body = { model: MODEL, max_tokens, messages: msgs };
  if(system) body.system = system;

  for(let attempt=0; ; attempt++){
    let res;
    try{
      res = await fetch("/api/chat",{
        method:"POST",
        headers: authHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify(body),
      });
    }catch(e){ throw new Error("NETWORK"); }

    // Free-tier rate limit: wait and retry a few times before giving up
    if(res.status===429 && attempt < retries){
      await new Promise(r=>setTimeout(r, 2500*(attempt+1)));
      continue;
    }
    if(res.status===401 || res.status===403) throw new Error("AUTH");
    if(res.status===404) throw new Error("NO_FUNCTION");
    if(res.status===429) throw new Error("RATE_LIMIT");
    if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error("API "+res.status+" "+t.slice(0,160)); }
    const data = await res.json();
    return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  }
}
function friendlyError(e){
  const m=(e&&e.message)||"";
  if(m==="NO_FUNCTION") return "The AI service isn't running here. It works automatically once deployed to Cloudflare Pages. To test locally, run: npx wrangler pages dev .";
  if(m==="AUTH") return "Your sign-in expired or isn't authorized. Sign out and back in, and check the allowlist in the Cloudflare function.";
  if(m==="RATE_LIMIT") return "Anthropic is rate-limiting the API key right now. Wait a moment and try again.";
  if(m==="NETWORK") return "Couldn't reach the server. Check your connection and try again.";
  return "Something went wrong: "+m;
}
function parseJSON(text){
  let t = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a>=0 && b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}

// Extract text from a PDF in the browser (the binary never leaves this device)
async function extractPdfText(file, onProgress){
  const lib = window.pdfjsLib;
  if(!lib) throw new Error("PDF reader didn't load - check your connection and reload.");
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data: buf}).promise;
  const pages = Math.min(pdf.numPages, 80);
  let out = "";
  for(let i=1;i<=pages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out += content.items.map(it=>it.str).join(" ") + "\n\n";
    if(onProgress) onProgress(i/pages);
    if(out.length > 45000){ out += "\n[...document truncated for length...]"; break; }
  }
  return out.trim();
}

Read the attached Confidential Information Memorandum and return ONLY a JSON object (no markdown, no prose) with EXACTLY these keys:
{
 "name": string,                       // company / entity for sale

   "currentAssets": number,
   "currentLiab": number,
   "addbacks": [ {"label": string, "amount": number} ]  // EBITDA normalization add-backs, up to 5
 }
}
Be specific and honest - name the tradeoff. Do not inflate scores.

SCORING (critical - do this carefully):
Rate each of the five dimensions on this anchored scale, and USE THE FULL RANGE:
  90-100 = exceptional / rare - a genuine standout on this dimension
  75-89  = strong - clearly above average
  60-74  = solid / typical for a healthy small business
  45-59  = mixed - real concerns balancing the positives
  30-44  = weak - a material problem
  0-29   = disqualifying on this dimension
The five dimensions measure DIFFERENT things, so their scores should differ from each other - do NOT give the same number across dimensions.
  - financials: margin, growth, earnings quality, add-back risk, leverage
  - market: industry durability, demand, cyclicality, fragmentation
  - moat: switching costs, licensing, capability barriers, customer stickiness
  - management: depth below the owner, transition/key-person risk
  - fit: match to the firm mandate and hurdles stated above
Most real deals land in the 50-70 range. Reserve 80+ for genuinely excellent attributes and use sub-45 when warranted. DO NOT default every score to ~75 - a flat, uniform score set is a failure. The financials score may be recomputed from the extracted numbers, so focus your judgment on making market, moat, management, and fit clearly differ from one another.`; }

/* ---------- finance helpers ---------- */
function amortPayment(rate, nper, pv){ // annual payment on amortizing loan
  if(pv<=0) return 0; if(rate===0) return pv/nper;
  return pv*rate/(1-Math.pow(1+rate,-nper));
}
function irr(cfs){
  let r=0.15;
  for(let i=0;i<80;i++){
    let npv=0,d=0;
    for(let t=0;t<cfs.length;t++){ const f=Math.pow(1+r,t); npv+=cfs[t]/f; d+=-t*cfs[t]/(f*(1+r)); }
    if(!isFinite(d)||d===0) break;
    const nr=r-npv/d;
    if(!isFinite(nr)) break;
    if(Math.abs(nr-r)<1e-7){ r=nr; break; }
    r=Math.max(-0.99,nr);
  }
  return r;
}
function fmtUSD(n){ if(n==null||isNaN(n)) return "-"; const a=Math.abs(n);
  if(a>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(a>=1e3) return "$"+Math.round(n/1e3)+"K";
  return "$"+Math.round(n); }
function fmtPct(n){ return (n==null||isNaN(n)||!isFinite(n))?"-":(n*100).toFixed(1)+"%"; }
function cagr(a,b,yrs){ if(!a||!b||a<=0||b<=0) return null; return Math.pow(b/a,1/yrs)-1; }

// Full deal model given base EBITDA + assumptions
function computeModel(E, a){
  const price=E*a.mult;
  const debt=price*a.lev;
  const equity=Math.max(price-debt,0);
  const ds=amortPayment(a.rate, a.amort, debt);
  const rows=[]; let bal=debt, cumDist=0;
  for(let t=1;t<=a.hold;t++){
    const Et=E*Math.pow(1+a.growth,t);
    const interest=bal*a.rate;
    const principal=Math.min(Math.max(ds-interest,0),bal);
    bal=Math.max(bal-principal,0);
    const capex=Et*a.capex;
    const preTax=Et-ds-capex;
    const tax=Math.max(preTax,0)*a.tax;
    const dist=preTax-tax;
    cumDist+=dist;
    rows.push({t,Et,interest,principal,capex,tax,dist,coc:equity>0?dist/equity:0});
  }
  const Elast=E*Math.pow(1+a.growth,a.hold);
  const terminalEquity=Math.max(Elast*a.exit-bal,0);
  const cfs=[-equity, ...rows.map((r,i)=> r.dist + (i===rows.length-1?terminalEquity:0))];
  const moic=equity>0?(cumDist+terminalEquity)/equity:0;
  return {
    price,debt,equity,ds,rows,
    coc1: rows.length?rows[0].coc:0,
    dscr: ds>0?(E*(1+a.growth))/ds:Infinity,
    cumDist, terminalEquity, moic, irr:irr(cfs),
  };
}
const DEFAULT_ASSUMP={mult:5, lev:0.5, rate:0.10, amort:10, growth:0.05, capex:0.05, tax:0, hold:5, exit:5};

// Highest entry multiple that still clears the cash-on-cash target AND the DSCR floor,
// holding all other assumptions fixed. Returns a multiple, or null if even 2.0x fails.
function maxEntryMultiple(E, a, cocTarget, dscrFloor){
  for(let mm=8; mm>=2; mm-=0.05){
    const r=computeModel(E,{...a,mult:mm});
    if(r.coc1>=cocTarget && (!isFinite(r.dscr) || r.dscr>=dscrFloor)) return Math.round(mm*20)/20;
  }
  return null;
}

function Root(){

  const configured = !GOOGLE_CLIENT_ID.startsWith("YOUR_GOOGLE_CLIENT_ID");

  const onCredential = useCallback((resp)=>{
    const token=resp.credential; const p=decodeJwt(token);
    if(!p) return;
    store.userId=p.sub; store.idToken=token;
    setUser({sub:p.sub,name:p.name||p.email,email:p.email,picture:p.picture});
  },[]);

  useEffect(()=>{
    if(!configured) return;
    let tries=0;
    const iv=setInterval(()=>{
      if(window.google && window.google.accounts && window.google.accounts.id){
        clearInterval(iv);
        window.google.accounts.id.initialize({
          client_id:GOOGLE_CLIENT_ID, callback:onCredential, auto_select:true, cancel_on_tap_outside:false,
        });
        setReady(true);
        window.google.accounts.id.prompt(); // silent re-sign-in for returning users
      }else if(++tries>60){ clearInterval(iv); setReady(true); }
    },100);
    return ()=>clearInterval(iv);
  },[configured,onCredential]);

  const signOut=()=>{
    try{ window.google?.accounts?.id?.disableAutoSelect(); }catch(e){}
    store.userId="anon"; store.idToken=""; setUser(null);
  };

  if(!configured) return <SetupScreen/>;
  if(!user) return <AuthScreen ready={ready} onCredential={onCredential}/>;
  return <App user={user} onSignOut={signOut}/>;
}

/* ---------- Gauge (signature instrument) ---------- */
function Gauge({value}){
  const [v,setV]=useState(0);
  useEffect(()=>{ const t=setTimeout(()=>setV(value),120); return ()=>clearTimeout(t); },[value]);
  const R=78, cx=95, cy=95;
  const a0=Math.PI, a1=0;                    // 180° -> 0°
  const ang=a0+(a1-a0)*(v/100);
  const pt=(r,a)=>[cx+r*Math.cos(a), cy-r*Math.sin(a)];
  const arc=(r,frac)=>{ const e=a0+(a1-a0)*frac; const [sx,sy]=pt(r,a0),[ex,ey]=pt(r,e);
    return `M ${sx} ${sy} A ${r} ${r} 0 0 1 ${ex} ${ey}`; };
  const [nx,ny]=pt(R-14,ang);
  const col=scoreColor(v);
  return (
    <svg viewBox="0 0 190 118" style={{width:220}}>
      <path d={arc(R,1)} stroke="#1c2a41" strokeWidth="10" fill="none" strokeLinecap="round"/>
      <path d={arc(R,v/100)} stroke={col} strokeWidth="10" fill="none" strokeLinecap="round"
        style={{transition:"all .9s cubic-bezier(.2,.7,.2,1)", filter:`drop-shadow(0 0 6px ${col})`}}/>
      {[0,25,50,75,100].map(m=>{ const [tx,ty]=pt(R+13,a0+(a1-a0)*(m/100));
        return <text key={m} x={tx} y={ty} fill="#5f708c" fontSize="8" fontFamily="JetBrains Mono"
          textAnchor="middle" dominantBaseline="middle">{m}</text>; })}
      <line x1={cx} y1={cy} x2={nx} y2={ny} stroke={col} strokeWidth="2.5" strokeLinecap="round"
        style={{transition:"all .9s cubic-bezier(.2,.7,.2,1)"}}/>
      <circle cx={cx} cy={cy} r="5" fill="#0d1522" stroke={col} strokeWidth="2"/>
      <text x={cx} y={cy-22} fill={col} fontSize="30" fontFamily="JetBrains Mono" fontWeight="700"
        textAnchor="middle">{Math.round(v)}</text>
      <text x={cx} y={cy-6} fill="#5f708c" fontSize="8" fontFamily="JetBrains Mono"
        letterSpacing="2" textAnchor="middle">DEAL SCORE</text>
    </svg>
  );
}

        <div className="card">

      {deal.analystNotes && <div className="card" style={{marginTop:16}}>
        <h3>Analyst notes</h3><div className="summary">{deal.analystNotes}</div>

}
function verdictColor(v){ return v==="PURSUE"?"var(--go)":v==="PASS"?"var(--pass)":"var(--watch)"; }

/* ---------- Review (edit view) ---------- */
function Review({deal,saveDeal}){
  const [d,setD]=useState(deal);
  const [saved,setSaved]=useState(false);
  useEffect(()=>{setD(deal);},[deal.id]);
  const upd=(patch)=>{ setD(p=>({...p,...patch})); setSaved(false); };
  const updList=(key,i,val)=>{ const arr=[...(d[key]||[])]; arr[i]=val; upd({[key]:arr}); };
  const addItem=(key)=>upd({[key]:[...(d[key]||[]),""]});
  const delItem=(key,i)=>upd({[key]:(d[key]||[]).filter((_,x)=>x!==i)});
  const updRating=(k,v)=>upd({ratings:{...d.ratings,[k]:+v}});
  const updFin=(k,v)=>{
    const num=v===""?0:Number(v);
    const fin={...(d.fin||{}), [k]: num};
    const ratings={...d.ratings};
    const fs=scoreFinancials(fin, CFG); if(fs!=null) ratings.financials=fs;
    const overall=overallFromRatings(ratings, CFG.weights);
    const patch={ fin, ratings, overall: overall==null?d.overall:overall };
    if(k==="ebitda" && num>0) patch.ebitda=fmtUSD(num);
    if(k==="revenue" && num>0) patch.revenue=fmtUSD(num);
    setD(p=>({...p, ...patch})); setSaved(false);
  };
  const save=async()=>{ await saveDeal(d); setSaved(true); };

  return (
    <div>
      <div className="card">
        <p className="lead" style={{marginTop:0}}>Everything here is yours to overwrite - the AI pass is a starting point, not the record. Your edits are what the deck keeps.</p>
        <div className="field"><label>Deal summary</label>
          <textarea rows="4" value={d.summary||""} onChange={e=>upd({summary:e.target.value})}/></div>

        <div className="grid2">
          <div className="field"><label>Company name</label>
            <input type="text" value={d.name||""} onChange={e=>upd({name:e.target.value})}/></div>
          <div className="field"><label>One-liner</label>
            <input type="text" value={d.oneLiner||""} onChange={e=>upd({oneLiner:e.target.value})}/></div>
        </div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <h3>Reported figures <span className="tag ai">CONFIRM</span></h3>
        <p className="lead" style={{marginTop:-6}}>Pulled from the CIM. Correct anything the AI misread - the <b>Financial quality</b> score and overall recompute from these instantly.</p>
        <div className="fingrid">
          {[["revenue","Revenue"],["ebitda","Adj. EBITDA"],["revPrior","Revenue (prior yr)"],["ebitdaPrior","EBITDA (prior yr)"],["netDebt","Net / LT debt"],["currentAssets","Current assets"],["currentLiab","Current liabilities"]].map(([k,label])=>(
            <div className="field" key={k} style={{marginBottom:0}}>
              <label>{label} ($)</label>
              <input type="number" value={(d.fin&&d.fin[k])||0} onChange={e=>updFin(k,e.target.value)}/>
            </div>
          ))}
          <div className="field" style={{marginBottom:0,alignSelf:"end"}}>
            <label>Financial score</label>
            <div style={{fontFamily:"JetBrains Mono",fontWeight:700,fontSize:20,color:scoreColor(d.ratings&&d.ratings.financials),padding:"6px 0"}}>{(d.ratings&&d.ratings.financials)??"–"}</div>
          </div>
        </div>
      </div>

      <div className="grid2" style={{marginTop:16}}>
        <div className="card"><h3>Pros</h3><ListEdit items={d.pros} onChange={(i,v)=>updList("pros",i,v)}
          onAdd={()=>addItem("pros")} onDel={i=>delItem("pros",i)} ph="A reason to pursue"/></div>
        <div className="card"><h3>Cons</h3><ListEdit items={d.cons} onChange={(i,v)=>updList("cons",i,v)}
          onAdd={()=>addItem("cons")} onDel={i=>delItem("cons",i)} ph="A concern"/></div>
      </div>

      <div className="grid2" style={{marginTop:16}}>
        <div className="card"><h3>Ratings</h3>
          <div className="ratings">{RATING_KEYS.map(([k,label])=>(
            <div className="rrow" key={k}>
              <div className="rl"><span className="name">{label}</span>
                <span className="num" style={{color:scoreColor(d.ratings?.[k])}}>{d.ratings?.[k]??0}</span></div>
              <input type="range" min="0" max="100" value={d.ratings?.[k]??0} onChange={e=>updRating(k,e.target.value)}/>
            </div>))}
          </div>
        </div>
        <div className="card"><h3>Risk flags</h3><ListEdit items={d.risks} onChange={(i,v)=>updList("risks",i,v)}
          onAdd={()=>addItem("risks")} onDel={i=>delItem("risks",i)} ph="A diligence risk"/></div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="field" style={{marginBottom:20}}><label>Overall deal score - {d.overall??0}</label>
          <input type="range" min="0" max="100" value={d.overall??0} onChange={e=>upd({overall:+e.target.value})}/></div>
        <div className="field" style={{marginBottom:0}}><label>Final verdict</label>
          <div className="verdictpick">{VERDICTS.map(v=>(
            <button key={v} className={"vp "+v+(d.verdict===v?" sel":"")} onClick={()=>upd({verdict:v})}>{v}</button>
          ))}</div>
        </div>
        <div className="field" style={{marginTop:18,marginBottom:0}}><label>Verdict rationale</label>
          <textarea rows="2" value={d.verdictReason||""} onChange={e=>upd({verdictReason:e.target.value})}/></div>
      </div>

      <div className="card" style={{marginTop:16}}><h3>Recommended next steps</h3>
        <ListEdit items={d.nextSteps} onChange={(i,v)=>updList("nextSteps",i,v)}
          onAdd={()=>addItem("nextSteps")} onDel={i=>delItem("nextSteps",i)} ph="A concrete next step"/></div>

      <div className="card" style={{marginTop:16}}><h3>Analyst notes</h3>
        <div className="field" style={{marginBottom:0}}>
          <textarea rows="4" placeholder="Your own read - anything the AI missed, gut checks, questions for the seller call…"
            value={d.analystNotes||""} onChange={e=>upd({analystNotes:e.target.value})}/></div>
      </div>

      <div className="savebar">
        <button className="savebtn" onClick={save}>Save review</button>
        {saved && <span className="saved">✓ Saved to deck</span>}
      </div>
    </div>
  );
}
function ListEdit({items,onChange,onAdd,onDel,ph}){
  return (
    <div className="listedit">
      {(items||[]).map((v,i)=>(
        <div className="row" key={i}>
          <input type="text" value={v} placeholder={ph} onChange={e=>onChange(i,e.target.value)}/>
          <button className="iconbtn" onClick={()=>onDel(i)} title="Remove">✕</button>

      ))}
      <button className="addbtn" onClick={onAdd}>＋ Add</button>

}

/* ---------- Chat ---------- */
function cocCellBg(v){ if(v>=0.25) return "rgba(55,217,160,.22)"; if(v>=0.15) return "rgba(255,176,46,.16)"; if(v>=0) return "rgba(255,93,108,.14)"; return "rgba(255,93,108,.3)"; }
function cocText(v){ if(v>=0.25) return "var(--go)"; if(v>=0.15) return "var(--watch)"; return "var(--pass)"; }
function dscrColor(v){ if(v>=1.5) return "var(--go)"; if(v>=1.25) return "var(--watch)"; return "var(--pass)"; }

function Model({deal,saveDeal,settings}){
  const fin=deal.fin||{};
  const build=()=>({
    ebitda: dealEbitda(deal),
    addbacks: (deal.model&&deal.model.addbacks) || (fin.addbacks||[]).map(x=>({label:x.label||"Add-back",amount:Number(x.amount)||0,keep:1})),
    a: (deal.model&&deal.model.a) || {...DEFAULT_ASSUMP},
  });
  const [ebitda,setEbitda]=useState(build().ebitda);
  const [addbacks,setAddbacks]=useState(build().addbacks);
  const [a,setA]=useState(build().a);
  useEffect(()=>{ const i=build(); setEbitda(i.ebitda); setAddbacks(i.addbacks); setA(i.a); },[deal.id]);

  const timer=useRef();
  useEffect(()=>{ clearTimeout(timer.current);
    timer.current=setTimeout(()=>saveDeal({...deal, ...(ebitda>0?{ebitda:fmtUSD(ebitda)}:{}), fin:{...deal.fin, ebitda}, model:{ebitda,addbacks,a}}),700);
    return ()=>clearTimeout(timer.current);
  },[ebitda,addbacks,a]);

  const setAsm=(k,v)=>setA(p=>({...p,[k]:v}));
  const haircut=addbacks.reduce((s,x)=>s+(x.amount||0)*(1-x.keep),0);
  const adjE=Math.max(ebitda-haircut,0);
  const m=computeModel(adjE,a);

  const COC_TARGET=(Number(settings?.cocTarget)||25)/100, DSCR_FLOOR=Number(settings?.dscrFloor)||1.5;
  const bandLo=Number(settings?.multLow)||4, bandHi=Number(settings?.multHigh)||6;
  const passCoC=m.coc1>=COC_TARGET, passDSCR=(!isFinite(m.dscr)||m.dscr>=DSCR_FLOOR), inBand=a.mult>=bandLo&&a.mult<=bandHi;
  const clears=passCoC&&passDSCR;
  const bandTxt=`${bandLo}–${bandHi}×`;
  const readState = adjE<=0 ? "ENTER EBITDA TO MODEL" : clears ? (inBand?"CLEARS THE HURDLES":`WORKS - PRICED ABOVE ${bandTxt} BAND`) : "BELOW THE HURDLES";
  const readColor = adjE<=0 ? "var(--muted)" : clears ? (inBand?"var(--go)":"var(--watch)") : "var(--pass)";
  const maxMult = adjE>0 ? maxEntryMultiple(adjE,a,COC_TARGET,DSCR_FLOOR) : null;
  const maxPriceUSD = maxMult!=null ? adjE*maxMult : null;

  const mults=[3.5,4,4.5,5,5.5,6,6.5];
  const levs=[0,0.3,0.5,0.6,0.7];
  const nearest=(arr,v)=>arr.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p,arr[0]);
  const curM=nearest(mults,a.mult), curL=nearest(levs,a.lev);

  const revYoY=cagr(fin.revPrior,fin.revenue,1);
  const ebYoY=cagr(fin.ebitdaPrior,fin.ebitda,1);
  const margin=fin.revenue?fin.ebitda/fin.revenue:null;
  const curRatio=fin.currentLiab?fin.currentAssets/fin.currentLiab:null;

  const Sl=({label,val,disp,min,max,step,onCh})=>(
    <div className="row">
      <div className="lab"><span>{label}</span><span className="v">{disp}</span></div>
      <input type="range" min={min} max={max} step={step} value={val} onChange={e=>onCh(+e.target.value)}/>
    </div>
  );

  return (
    <div>
      <div className="s5read" style={{borderColor:readColor}}>
        <div className="s5read-l">
          <span className="s5read-tag" style={{color:readColor,borderColor:readColor}}>{readState}</span>
          <span className="s5read-txt">
            {adjE<=0
              ? "Add the CIM's adjusted EBITDA below and the whole model comes alive."
              : <>At <b>{a.mult.toFixed(2)}×</b> with <b>{(a.lev*100).toFixed(0)}%</b> debt, this returns <b style={{color:cocText(m.coc1)}}>{fmtPct(m.coc1)}</b> Yr-1 cash-on-cash{isFinite(m.dscr)?<> at <b style={{color:dscrColor(m.dscr)}}>{m.dscr.toFixed(2)}×</b> coverage</>:" (all-equity, no debt)"}. Target is ≥{settings?.cocTarget||25}% and ≥{(settings?.dscrFloor||1.5)}×.</>}
          </span>
        </div>
      </div>

      {adjE>0 && <div className="solver">
        <div className="solver-main">
          <div className="k">Most you should pay <span className="q" title={`Highest entry price that still clears ≥${settings?.cocTarget||25}% cash-on-cash and ≥${settings?.dscrFloor||1.5}× DSCR at your current leverage and operating assumptions.`}>ⓘ</span></div>
          {maxMult!=null
            ? <div className="solver-val">{fmtUSD(maxPriceUSD)} <span className="solver-x">{maxMult.toFixed(2)}× adj. EBITDA</span></div>
            : <div className="solver-val" style={{color:"var(--pass)"}}>No price clears both hurdles <span className="solver-x">at these assumptions</span></div>}
          <div className="solver-sub">
            {maxMult!=null
              ? (a.mult<=maxMult+1e-9 ? "Your current price is within the disciplined range." : "Your current price is above this - you'd break a hurdle.")
              : "Lower leverage or rate, or require faster growth, to open room."}
          </div>
        </div>
        {maxMult!=null && <button className="solver-btn" onClick={()=>setAsm("mult",maxMult)}>Set entry to {maxMult.toFixed(2)}×</button>}
      </div>}

      <div className="kpis">
        <div className="kpi"><div className="k">Purchase price</div>
          <div className="big">{fmtUSD(m.price)}</div><div className="sub">{a.mult.toFixed(2)}× adj. EBITDA</div></div>
        <div className="kpi"><div className="k">Equity check</div>
          <div className="big">{fmtUSD(m.equity)}</div><div className="sub">{fmtUSD(m.debt)} debt @ {(a.rate*100).toFixed(1)}%</div></div>
        <div className="kpi"><div className="k">Yr-1 cash-on-cash</div>
          <div className="big" style={{color:cocText(m.coc1)}}>{fmtPct(m.coc1)}</div>
          <div className="sub">target ≥ {settings?.cocTarget||25}%</div></div>
        <div className="kpi"><div className="k">DSCR (Yr 1)</div>
          <div className="big" style={{color:dscrColor(m.dscr)}}>{isFinite(m.dscr)?m.dscr.toFixed(2)+"×":"n/a"}</div>
          <div className="sub">covenant floor ~1.25×</div></div>
      </div>

      <div className="mgrid">
        <div className="card asm">
          <h3>Assumptions</h3>
          <div className="field" style={{marginBottom:16}}>
            <label>Adjusted EBITDA (base)</label>
            <input type="number" value={ebitda} onChange={e=>setEbitda(+e.target.value||0)}/>
          </div>
          <Sl label="Entry multiple" val={a.mult} disp={a.mult.toFixed(2)+"×"} min={2} max={8} step={0.25} onCh={v=>setAsm("mult",v)}/>
          <Sl label="Leverage (debt %)" val={a.lev} disp={(a.lev*100).toFixed(0)+"%"} min={0} max={0.8} step={0.05} onCh={v=>setAsm("lev",v)}/>
          <Sl label="Interest rate" val={a.rate} disp={(a.rate*100).toFixed(1)+"%"} min={0.05} max={0.15} step={0.005} onCh={v=>setAsm("rate",v)}/>
          <Sl label="Amortization (yrs)" val={a.amort} disp={a.amort+" yr"} min={5} max={25} step={1} onCh={v=>setAsm("amort",v)}/>
          <Sl label="EBITDA growth / yr" val={a.growth} disp={(a.growth*100).toFixed(0)+"%"} min={-0.05} max={0.20} step={0.01} onCh={v=>setAsm("growth",v)}/>
          <Sl label="Maint. capex (% EBITDA)" val={a.capex} disp={(a.capex*100).toFixed(0)+"%"} min={0} max={0.20} step={0.01} onCh={v=>setAsm("capex",v)}/>
          <Sl label="Cash tax rate" val={a.tax} disp={(a.tax*100).toFixed(0)+"%"} min={0} max={0.4} step={0.01} onCh={v=>setAsm("tax",v)}/>
          <Sl label="Illustrative hold" val={a.hold} disp={a.hold+" yr"} min={3} max={10} step={1} onCh={v=>setAsm("hold",v)}/>
          <Sl label="Exit multiple" val={a.exit} disp={a.exit.toFixed(2)+"×"} min={2} max={8} step={0.25} onCh={v=>setAsm("exit",v)}/>
          <p className="lead" style={{margin:"6px 0 0"}}>Autosaves. Permanent-hold basis - MOIC/IRR use the exit multiple only to sketch value, not as a sale plan.</p>
        </div>

        <div>
          <div className="card" style={{marginBottom:16}}>
            <h3>Cash-on-cash sensitivity <span className="tag ai">YR 1</span></h3>
            <p className="lead" style={{marginTop:-6}}>Year-1 cash yield on equity across entry price and leverage. Green clears the 25% bar.</p>
            <div style={{overflowX:"auto"}}>
            <table className="sens">
              <thead><tr><th>mult ＼ debt%</th>{levs.map(l=><th key={l}>{(l*100).toFixed(0)}%</th>)}</tr></thead>
              <tbody>
                {mults.map(mm=>(
                  <tr key={mm}>
                    <th>{mm.toFixed(2)}×</th>
                    {levs.map(l=>{ const v=computeModel(adjE,{...a,mult:mm,lev:l}).coc1;
                      const cur=(mm===curM&&l===curL);
                      return <td key={l} className={cur?"cur":""} style={{background:cocCellBg(v),color:cocText(v)}}>{fmtPct(v)}</td>; })}
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>

          <div className="grid2">
            <div className="card">
              <h3>Return sketch</h3>
              <div className="ratings">
                <div className="rrow"><div className="rl"><span className="name">Cumulative distributions ({a.hold}y)</span><span className="num">{fmtUSD(m.cumDist)}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">Terminal equity @ {a.exit.toFixed(2)}×</span><span className="num">{fmtUSD(m.terminalEquity)}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">MOIC</span><span className="num">{m.moic?m.moic.toFixed(2)+"×":"-"}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">IRR</span><span className="num" style={{color:cocText(m.irr)}}>{fmtPct(m.irr)}</span></div></div>
              </div>
            </div>
            <div className="card">
              <h3>Trend &amp; quality</h3>
              <div className="ratings">
                <div className="rrow"><div className="rl"><span className="name">Revenue (latest)</span><span className="num">{fin.revenue?fmtUSD(fin.revenue):"-"}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">Revenue YoY</span><span className="num" style={{color:revYoY!=null?cocText(revYoY+0.15):"inherit"}}>{revYoY!=null?fmtPct(revYoY):"-"}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">EBITDA margin</span><span className="num">{margin!=null?fmtPct(margin):"-"}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">EBITDA YoY</span><span className="num">{ebYoY!=null?fmtPct(ebYoY):"-"}</span></div></div>
                <div className="rrow"><div className="rl"><span className="name">Current ratio</span><span className="num">{curRatio!=null?curRatio.toFixed(1)+"×":"-"}</span></div></div>
              </div>
            </div>
          </div>

          <div className="card" style={{marginTop:16}}>
            <h3>Add-back scrutiny <span className="tag risk">HAIRCUT</span></h3>
            <p className="lead" style={{marginTop:-6}}>Discount add-backs you don't fully believe. Base EBITDA drops accordingly and the whole model reprices.</p>
            {addbacks.length===0 && <p className="lead">No add-backs were extracted. Add them in the Review tab or trust the base EBITDA above.</p>}
            <div className="abk">
              {addbacks.map((x,i)=>(
                <div className="row" key={i}>
                  <span style={{fontSize:12.5}}>{x.label}</span>
                  <span className="amt">{fmtUSD(x.amount)}</span>
                  <span>
                    <input type="range" min={0} max={1} step={0.1} value={x.keep}
                      onChange={e=>{ const v=+e.target.value; setAddbacks(p=>p.map((y,j)=>j===i?{...y,keep:v}:y)); }}/>
                    <div className="keep">keep {(x.keep*100).toFixed(0)}%</div>
                  </span>
                </div>
              ))}
            </div>
            {(haircut>0||adjE!==ebitda) && <div style={{marginTop:12,padding:"10px 13px",borderRadius:9,background:"var(--deck)",display:"flex",justifyContent:"space-between",fontFamily:"JetBrains Mono",fontSize:12.5}}>
              <span style={{color:"var(--muted)"}}>Conservative EBITDA after haircut</span>
              <strong style={{color:"var(--signal)"}}>{fmtUSD(adjE)}</strong>
            </div>}
          </div>
        </div>
      </div>
    </div>
  );
}

function Chat({deal,saveDeal,pdfCache,settings}){
  const [messages,setMessages]=useState(deal.chat||[]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  const scrollRef=useRef(null);
  useEffect(()=>{setMessages(deal.chat||[]);},[deal.id]);
  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight; },[messages,busy]);

  const system = `You are a deal analyst assistant, answering questions about ONE specific CIM for the deals team.
FIRM MANDATE: ${settings.thesis}
HURDLES: entry ${settings.multLow}–${settings.multHigh}× · ${settings.cocTarget}% cash-on-cash · ${settings.dscrFloor}× DSCR · EBITDA $${settings.ebitdaMin}–${settings.ebitdaMax}M.${settings.avoid?` Deal-breakers: ${settings.avoid}.`:""}
Ground every answer in the deal facts below; if something isn't covered, say it's not in the CIM and flag it as a diligence item. Be concise, specific, and honest about tradeoffs.

=== DEAL: ${deal.name} ===
${deal.digest||deal.summary}

CURRENT VERDICT: ${deal.verdict} (${deal.overall}/100) - ${deal.verdictReason}
PROS: ${(deal.pros||[]).join("; ")}
CONS: ${(deal.cons||[]).join("; ")}
RISKS: ${(deal.risks||[]).join("; ")}`;

  const send=async(text)=>{
    const q=(text??input).trim(); if(!q||busy) return;
    setErr(""); setInput("");
    const next=[...messages,{role:"user",content:q}];
    setMessages(next); setBusy(true);
    try{
      const reply=await callClaude(next.map(m=>({role:m.role,content:m.content})),{system});
      const done=[...next,{role:"assistant",content:reply}];
      setMessages(done); await saveDeal({...deal,chat:done});
    }catch(e){

function clamp(n){ n=+n; if(isNaN(n)) return 0; return Math.max(0,Math.min(100,Math.round(n))); }
// Headline score, computed from the sub-ratings (weighted to the firm's priorities) rather
// than trusted from the model - which otherwise flattens everything to ~75.
function overallFromRatings(r, weights){
  if(!r || typeof r!=="object") return null;
  const w = weights || CFG.weights;
  let sum=0, wsum=0;
  for(const k in w){ const v=Number(r[k]); const wt=Number(w[k])||0; if(!isNaN(v)&&wt>0){ sum+=v*wt; wsum+=wt; } }
  return wsum>0 ? clamp(sum/wsum) : null;
}

/* ================= PIPELINE · DILIGENCE · MEMO · BENCHMARK ================= */
const STAGES=["New","Screening","Diligence","IC","Offer","Closed","Passed"];
function stageColor(s){ return ({New:"#8496b3",Screening:"#5ab0ff",Diligence:"#ffb02e",IC:"#c084fc",Offer:"#37d9a0",Closed:"#37d9a0",Passed:"#ff5d6c"})[s]||"#8496b3"; }

// parse "$2.4M", "$395.2 million", "12,163,791" -> number
function parseMoney(str){
  if(str==null) return 0;
  if(typeof str==="number") return str;
  const s=String(str).replace(/,/g,"");
  const m=s.match(/(-?\d+(?:\.\d+)?)\s*(k|m|b|thousand|million|billion)?/i);
  if(!m) return 0;
  let n=parseFloat(m[1]); const u=(m[2]||"").toLowerCase();
  if(u==="k"||u==="thousand") n*=1e3;
  else if(u==="m"||u==="million") n*=1e6;
  else if(u==="b"||u==="billion") n*=1e9;
  return n;
}
// single source of truth for a deal's reported EBITDA (numeric)
function dealEbitda(deal){
  const f=Number(deal&&deal.fin&&deal.fin.ebitda)||0;
  if(f>0) return f;
  const mm=Number(deal&&deal.model&&deal.model.ebitda)||0;
  if(mm>0) return mm;
  return parseMoney(deal&&deal.ebitda);
}

// quick model numbers for a deal (saved model if present, else defaults seeded from fin)
function dealQuick(deal){
  let ebitda = dealEbitda(deal);
  let a = (deal&&deal.model&&deal.model.a) || DEFAULT_ASSUMP;
  let addbacks = (deal&&deal.model&&deal.model.addbacks) || [];
  const haircut=addbacks.reduce((s,x)=>s+(x.amount||0)*(1-(x.keep==null?1:x.keep)),0);
  const adjE=Math.max(ebitda-haircut,0);
  const m = adjE>0 ? computeModel(adjE,a) : null;
  return {adjE, baseE:ebitda, mult:a.mult, coc1:m?m.coc1:null, dscr:m?m.dscr:null};
}
function pipeStats(deals){
  const withE=deals.filter(d=>Number(d&&d.fin&&d.fin.ebitda)>0);
  const avg=(arr)=>arr.length?arr.reduce((s,x)=>s+x,0)/arr.length:null;
  const scores=deals.map(d=>Number(d.overall)).filter(x=>!isNaN(x)&&x>0);
  const mults=deals.map(d=>dealQuick(d).mult).filter(x=>x>0);
  const margins=withE.map(d=>d.fin.revenue?d.fin.ebitda/d.fin.revenue:null).filter(x=>x!=null);
  const totalE=withE.reduce((s,d)=>s+Number(d.fin.ebitda),0);
  return {n:deals.length, avgScore:avg(scores), avgMult:avg(mults), avgMargin:avg(margins), totalE};
}

    {label:"Adj. EBITDA", get:d=>dealEbitda(d)||null, fmt:v=>fmtUSD(v), better:"hi"},
    {label:"EBITDA margin", get:d=>(d.fin&&d.fin.revenue)?d.fin.ebitda/d.fin.revenue:null, fmt:v=>Math.round(v*100)+"%", better:"hi"},
    {label:"Revenue growth", get:d=>cagr(d.fin&&d.fin.revPrior, d.fin&&d.fin.revenue,1), fmt:v=>Math.round(v*100)+"%", better:"hi"},
    {label:"Entry multiple", get:d=>q(d).mult||null, fmt:v=>v.toFixed(2)+"×", better:"lo"},
    {label:"Cash-on-cash", get:d=>q(d).coc1, fmt:v=>fmtPct(v), better:"hi", color:v=>cocText(v)},
    {label:"DSCR", get:d=>{const x=q(d).dscr; return (x!=null&&isFinite(x))?x:null;}, fmt:v=>v.toFixed(2)+"×", better:"hi", color:v=>dscrColor(v)},
    {section:"Ratings"},
    ...RATING_KEYS.map(([k,label])=>({label, get:d=>(d.ratings&&d.ratings[k]!=null)?d.ratings[k]:null, fmt:v=>Math.round(v), better:"hi", color:v=>scoreColor(v)})),
  ];
  const bestIdx=(row)=>{ if(!row.better) return -1; let bi=-1,bv=null;
    picked.forEach((d,i)=>{ const v=row.get(d); if(v==null||isNaN(v))return;

        {deals.map(d=>{ const on=sel.includes(d.id); return (
          <button key={d.id} className={"cmp-chip"+(on?" on":"")} onClick={()=>toggle(d.id)}>
            <span className="dot" style={{background:on?"var(--signal)":"#33435d"}}></span>{d.name||"Untitled"}
          </button>); })}
      </div>

      {picked.length<2
        ? <div className="card" style={{textAlign:"center",color:"var(--muted)"}}>Select at least two deals to compare.</div>
        : <div className="cmp-wrap"><table className="cmp">
          <thead><tr><th className="rowlab"></th>
            {picked.map(d=><th key={d.id} onClick={()=>onPick(d.id)}>

          </tr></thead>
          <tbody>
            {rows.map((row,ri)=> row.section
              ? <tr key={ri} className="cmp-sec"><td colSpan={picked.length+1}>{row.section}</td></tr>
              : (()=>{ const bi=bestIdx(row); return (

                  <td className="rowlab">{row.label}</td>

                    const disp=(v==null||(typeof v==="number"&&isNaN(v)))?"-":row.fmt(v);

                  })}
                </tr>); })()
            )}

    </div></div>

function BenchStrip({deal,deals}){
  const others=(deals||[]).filter(d=>d.id!==deal.id);
  if(others.length<1) return null;
  const st=pipeStats(deals);
  const q=dealQuick(deal);
  const margin=deal.fin&&deal.fin.revenue?deal.fin.ebitda/deal.fin.revenue:null;
  const cell=(label,v,avg,fmt,better)=>{ const delta=(v!=null&&avg!=null)?v-avg:null;
    return <div className="bcell"><div className="k">{label}</div><div className="v">{v!=null?fmt(v):"-"}</div>
      <div className="d" style={{color:delta==null?"var(--muted-2)":(better(delta)?"var(--go)":"var(--pass)")}}>{avg!=null?"pipeline "+fmt(avg):""}</div></div>; };
  return <div className="bench">
    <span className="eyebrow" style={{alignSelf:"center",whiteSpace:"nowrap"}}>vs pipeline · {others.length}</span>
    {cell("Score",Number(deal.overall)||null,st.avgScore,v=>Math.round(v),d=>d>=0)}
    {cell("Entry×",q.mult,st.avgMult,v=>v.toFixed(1)+"×",d=>d<=0)}
    {cell("Margin",margin,st.avgMargin,v=>Math.round(v*100)+"%",d=>d>=0)}
  </div>;
}

function buildDiligencePrompt(deal, s){

FIRM MANDATE: ${s.thesis}
Return ONLY JSON:
{
 "redFlags": [string],     // up to 6 concrete concerns a buyer should worry about

}

=== DEAL: ${deal.name} ===
${deal.digest||deal.summary}
Known cons: ${(deal.cons||[]).join("; ")}

    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,gap:12}}>
        <p className="lead" style={{margin:0}}>Generated {dg?new Date(dg.generatedAt).toLocaleDateString():""} · a buy-side read of the CIM's gaps.</p>
        <button className="ghost" onClick={gen} disabled={busy} style={{whiteSpace:"nowrap"}}>{busy?"Regenerating…":"Regenerate"}</button>
      </div>
      {err && <div className="errbox" style={{marginBottom:14}}>{err}</div>}
      <div className="grid2" style={{marginBottom:16}}>
        <List title="Red flags" items={dg.redFlags} tag="CONCERNS" tagcls="pass" mcls="cons"/>
        <List title="Missing from the CIM" items={dg.missingInfo} tag="GAPS" tagcls="risk" mcls="risks"/>
      </div>
      <div className="card" style={{marginBottom:16}}><h3>Document requests</h3><ol className="steps">{(dg.requests||[]).map((x,i)=><li key={i}>{x}</li>)}</ol></div>
      <div className="card"><h3>Questions for the seller call</h3><ol className="steps">{(dg.questions||[]).map((x,i)=><li key={i}>{x}</li>)}</ol></div>
    </div>
  );
}

function esc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function openMemo(deal){
  const q=dealQuick(deal);
  const row=(k,v)=>v?`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`:"";
  const li=(arr)=>(arr||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const dg=deal.diligence;
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(deal.name)} - Deal Memo</title><style>
    *{box-sizing:border-box}body{font:13px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,sans-serif;color:#111;margin:40px;max-width:820px}
    h1{font-size:22px;margin:0 0 2px}.sub{color:#555;margin:0 0 16px}
    h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#0a7a55;border-bottom:2px solid #0a7a55;padding-bottom:4px;margin:22px 0 10px}
    table{border-collapse:collapse;width:100%;margin:6px 0}td{border-bottom:1px solid #eee;padding:5px 8px;vertical-align:top}td:first-child{color:#666;width:38%}
    .tiles{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
    .tile{border:1px solid #ddd;border-radius:8px;padding:8px 12px;min-width:112px}.tile .k{font-size:10px;color:#888;text-transform:uppercase}.tile .v{font-size:18px;font-weight:700}
    ul,ol{margin:6px 0;padding-left:18px}li{margin:3px 0}.cols{display:flex;gap:24px}.cols>div{flex:1}
    .verdict{display:inline-block;padding:3px 12px;border-radius:6px;font-weight:700;border:2px solid #0a7a55}
    .foot{margin-top:30px;color:#999;font-size:10px;border-top:1px solid #eee;padding-top:8px}@media print{body{margin:0}}
  </style></head><body>
  <h1>${esc(deal.name||"Untitled")}</h1>
  <p class="sub">${esc(deal.oneLiner||"")}${deal.industry?" · "+esc(deal.industry):""}${deal.location?" · "+esc(deal.location):""}</p>
  <div class="tiles">
    <div class="tile"><div class="k">Overall</div><div class="v">${deal.overall==null?"–":deal.overall}/100</div></div>
    <div class="tile"><div class="k">Verdict</div><div class="v">${esc(deal.verdict||"-")}</div></div>
    <div class="tile"><div class="k">Adj. EBITDA</div><div class="v">${q.adjE?fmtUSD(q.adjE):esc(deal.ebitda||"-")}</div></div>
    <div class="tile"><div class="k">Entry×</div><div class="v">${q.mult?q.mult.toFixed(2)+"×":"-"}</div></div>
    <div class="tile"><div class="k">Cash-on-cash</div><div class="v">${q.coc1!=null?Math.round(q.coc1*100)+"%":"-"}</div></div>
    <div class="tile"><div class="k">DSCR</div><div class="v">${q.dscr!=null&&isFinite(q.dscr)?q.dscr.toFixed(2)+"×":"-"}</div></div>
  </div>
  <h2>Summary</h2><p>${esc(deal.summary||"")}</p>
  <h2>Recommendation</h2><p><span class="verdict">${esc(deal.verdict||"-")}</span>&nbsp; ${esc(deal.verdictReason||"")}</p>
  <h2>Key facts</h2><table>${row("Revenue",deal.revenue)}${row("Adj. EBITDA",deal.ebitda)}${row("Years in business",deal.years)}${row("Asking",deal.askNote)}${row("Stage",deal.stage)}</table>
  <div class="cols"><div><h2>Pros</h2><ul>${li(deal.pros)}</ul></div><div><h2>Cons</h2><ul>${li(deal.cons)}</ul></div></div>
  <h2>Risks</h2><ul>${li(deal.risks)}</ul>
  <h2>Recommended next steps</h2><ol>${li(deal.nextSteps)}</ol>
  ${dg?`<h2>Diligence - red flags</h2><ul>${li(dg.redFlags)}</ul><h2>Missing from the CIM</h2><ul>${li(dg.missingInfo)}</ul><h2>Document requests</h2><ol>${li(dg.requests)}</ol><h2>Seller-call questions</h2><ol>${li(dg.questions)}</ol>`:""}
  ${deal.analystNotes?`<h2>Analyst notes</h2><p>${esc(deal.analystNotes)}</p>`:""}
  <div class="foot">Deal Deck - generated ${new Date().toLocaleString()} · Confidential</div>
  <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print();},300);}</scr`+`ipt>
  </body></html>`;
  const w=window.open("","_blank");
  if(!w){ alert("Allow pop-ups for this site to export the memo."); return; }
  w.document.write(html); w.document.close();
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
